[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-assistant"
version = "2.1.0"
description = "Enterprise-grade AI Voice Assistant and System Automator"
authors = [
    {name = "Kamal", email = "developer@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "SpeechRecognition==3.10.0",
    "pyttsx3==2.90",
    "openai==1.3.0",
    "PyAudio==0.2.13",
    "psutil==5.9.6",
    "pyautogui==0.9.54",
    "python-dotenv==1.0.0"
]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
